name: Deploy to GitHub Pages

# Veröffentlicht die statische Website automatisch auf GitHub Pages.
# Voraussetzung: Repo → Settings → Pages → "Source: GitHub Actions" einstellen.

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # erlaubt manuelles Starten über den Actions-Tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
